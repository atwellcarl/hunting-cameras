name: Keep Supabase awake

# Free Supabase projects pause after 7 days without activity. One small API
# request every few days keeps Buck Book online through the off-season.
on:
  schedule:
    - cron: "17 14 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          url=$(grep -oE 'https://[a-z0-9]+\.supabase\.co' web/config.js)
          key=$(grep -oE 'sb_publishable_[A-Za-z0-9_-]+' web/config.js)
          code=$(curl -s -o /dev/null -w '%{http_code}' "$url/rest/v1/cards?select=id&limit=1" -H "apikey: $key")
          echo "Supabase answered HTTP $code"
          test "$code" -lt 500
